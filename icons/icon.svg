<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20362F"/>
      <stop offset="1" stop-color="#2F6F5E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6C768"/>
      <stop offset="1" stop-color="#D98A2B"/>
    </linearGradient>
    <linearGradient id="wal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F3"/>
      <stop offset="1" stop-color="#DCE8E2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="420" cy="80" r="150" fill="#fff" opacity=".07"/>
  <!-- coin -->
  <g>
    <circle cx="256" cy="190" r="86" fill="url(#gold)"/>
    <circle cx="256" cy="190" r="68" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="7"/>
    <!-- upward chart bars on the coin -->
    <rect x="218" y="198" width="16" height="30" rx="4" fill="#fff" opacity=".95"/>
    <rect x="248" y="176" width="16" height="52" rx="4" fill="#fff" opacity=".95"/>
    <rect x="278" y="150" width="16" height="78" rx="4" fill="#fff" opacity=".95"/>
  </g>
  <!-- wallet -->
  <rect x="96" y="238" width="320" height="196" rx="40" fill="url(#wal)"/>
  <path d="M96 290 h320" stroke="#20362F" stroke-opacity=".12" stroke-width="6"/>
  <rect x="304" y="316" width="140" height="84" rx="28" fill="#20362F"/>
  <circle cx="348" cy="358" r="14" fill="url(#gold)"/>
</svg>
